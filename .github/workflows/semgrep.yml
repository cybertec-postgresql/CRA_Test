name: semgrep

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  issues: write
  pull-requests: write

jobs:
  # Gate 2, secrets. Scans the commits this pull request adds (or, on main,
  # the commits just pushed) with the same gitleaks build the pre-push hook
  # uses, so a laptop that skipped the hook is caught here. The SARIF goes to
  # code scanning and to the scan job below, which turns it into issues.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan the commits being added
        id: gitleaks
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$HEAD"
          else
            RANGE="$BASE..$HEAD"
          fi
          echo "scanning $RANGE"
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --log-opts="$RANGE" --redact --no-banner \
            --report-format sarif --report-path /repo/gitleaks.sarif --exit-code 1

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Hand the SARIF to the triage step
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          retention-days: 7

      - name: Fail the check on findings
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "::error::gitleaks found a committed secret. Rotate it, remove it and rewrite the branch. See MERGE_GATES.md."
          exit 1

  # Gate 2, code and packages, plus triage. Waits for secret-scan so that one
  # triage run sees every finding on the pull request head.
  scan:
    runs-on: ubuntu-latest
    needs: [secret-scan]
    if: always()
    container:
      image: semgrep/semgrep:1.175.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan and emit SARIF
        run: |
          semgrep scan \
            --config=p/default \
            --config=p/python \
            --config=.semgrep/ \
            --metrics=off \
            --sarif -o semgrep.sarif \
            .

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          sarif_file: semgrep.sarif

      - name: Fetch the secret scan report
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gitleaks-sarif

      # Runs even when the scan failed: a failing scan is exactly when the
      # findings need an issue. Scores every finding, opens one issue per
      # CVE, secret or code finding, assigns the PR author, comments the
      # table on the PR. See TRIAGE.md.
      # Fails fast if a label definition breaks GitHub's limits (name 50,
      # description 100 characters) or the CWE vector table is inconsistent.
      - name: Check triage configuration
        if: always() && github.event_name == 'pull_request'
        run: python3 -m triage check

      - name: Triage findings into issues
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m triage pr --event "$GITHUB_EVENT_PATH" --sarif semgrep.sarif --sarif gitleaks.sarif

      - name: Fail the PR on findings
        run: |
          semgrep scan \
            --config=p/default \
            --config=p/python \
            --config=.semgrep/ \
            --metrics=off \
            --error \
            .
