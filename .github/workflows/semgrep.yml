name: semgrep

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  issues: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.175.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan and emit SARIF
        run: |
          semgrep scan \
            --config=p/default \
            --config=p/python \
            --config=.semgrep/ \
            --metrics=off \
            --sarif -o semgrep.sarif \
            .

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          sarif_file: semgrep.sarif

      # Runs even when the scan failed: a failing scan is exactly when the
      # findings need an issue. Scores every finding, opens one issue per
      # CVE or code finding, assigns the PR author, comments the table on
      # the PR. See TRIAGE.md.
      # Fails fast if a label definition breaks GitHub's limits (name 50,
      # description 100 characters) or the CWE vector table is inconsistent.
      - name: Check triage configuration
        if: always() && github.event_name == 'pull_request'
        run: python3 -m triage check

      - name: Triage findings into issues
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m triage pr --event "$GITHUB_EVENT_PATH" --sarif semgrep.sarif

      - name: Fail the PR on findings
        run: |
          semgrep scan \
            --config=p/default \
            --config=p/python \
            --config=.semgrep/ \
            --metrics=off \
            --error \
            .
