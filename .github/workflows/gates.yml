# Copy to .github/workflows/gates.yml in each repository. Pin the ref to a
# cra-gates commit sha once the first version is tagged.
name: gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  issues: write
  pull-requests: write

jobs:
  gates:
    uses: cybertec-postgresql/cra-gates/.github/workflows/gates.yml@3c49d6fb76a20ecd16aed5a9fe0214d9a2c6b8df
    with:
      private: false
