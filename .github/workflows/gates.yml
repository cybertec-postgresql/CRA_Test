# Copy to .github/workflows/gates.yml in each repository. Pin the ref to a
# cra-gates commit sha once the first version is tagged.
name: gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  issues: write
  pull-requests: write

jobs:
  gates:
    uses: cybertec-postgresql/cra-gates/.github/workflows/gates.yml@53209a89adf546ce77ea8772f031da4f8aa0d298
    with:
      private: false
