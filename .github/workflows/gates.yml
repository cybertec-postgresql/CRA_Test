# Copy to .github/workflows/gates.yml in each repository. Pin the ref to a
# cra-gates commit sha once the first version is tagged.
name: gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  issues: write
  pull-requests: write

jobs:
  gates:
    uses: cybertec-postgresql/cra-gates/.github/workflows/gates.yml@fc3ff8bf7f64f43a6e9b304307884374fdc64108
    with:
      private: false
