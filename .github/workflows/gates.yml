# Copy to .github/workflows/gates.yml in each repository. Pin the ref to a
# cra-gates commit sha once the first version is tagged.
name: gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  issues: write
  pull-requests: write

jobs:
  gates:
    uses: cybertec-postgresql/cra-gates/.github/workflows/gates.yml@9845b5e227e276ac60d06fd7df8e6c1572905432
    with:
      private: false
