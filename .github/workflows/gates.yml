# Copy to .github/workflows/gates.yml in each repository. Pin the ref to a
# cra-gates commit sha once the first version is tagged.
name: gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  issues: write
  pull-requests: write

jobs:
  gates:
    uses: cybertec-postgresql/cra-gates/.github/workflows/gates.yml@aa61601eb39067f089913f326372247202e2bea4
    with:
      private: false
